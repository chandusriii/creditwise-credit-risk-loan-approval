name: Fix app syntax

on:
  push:
    paths:
      - FIX_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix unterminated string in app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")
          old = "the project's held-out evaluation results"
          new = "the project held-out evaluation results"
          if old not in s:
              raise SystemExit("Expected syntax-error text was not found in app.py")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Commit fix and remove trigger
        run: |
          rm -f FIX_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py FIX_TRIGGER.md
          git diff --cached --quiet || git commit -m "Fix app.py unterminated string"
          git push